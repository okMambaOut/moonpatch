name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100
        with:
          version: latest
      - name: Resolve dependencies
        run: moon update
      - name: Format and strict checks
        run: |
          moon fmt --check
          moon check --target wasm-gc --deny-warn
          moon check --target wasm --deny-warn
          moon check --target js --deny-warn
      - name: Portable tests
        run: |
          moon test --target wasm-gc
          moon test --target wasm
          moon test --target js
      - name: Exercise JavaScript CLI
        run: |
          moon run cmd/moonpatch --target js -- demo | tee demo.txt
          diff -u examples/demo.expected.txt demo.txt
          moon run cmd/moonpatch --target js -- inspect --patch '--- a/note\n+++ b/note\n@@ -1 +1 @@\n-old\n+new\n' | tee inspect.txt
          diff -u examples/inspect.expected.txt inspect.txt
          set +e
          moon run cmd/moonpatch --target js -- inspect --patch '--- a/note\n+++ b/note\n@@ -1,2 +1 @@\n-old\n+new\n' > invalid.txt
          status=$?
          set -e
          test "$status" = "2"
          diff -u examples/invalid.expected.txt invalid.txt

  native:
    name: Native checks and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100
        with:
          version: latest
      - name: Resolve dependencies
        run: moon update
      - name: Native verification
        run: |
          moon check --target native --deny-warn
          moon test --target native
          moon build cmd/moonpatch --target native --release
          moon run cmd/moonpatch --target native -- demo | tee demo-native.txt
          diff -u examples/demo.expected.txt demo-native.txt
